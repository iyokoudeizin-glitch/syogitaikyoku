name: Build YaneuraOu WASM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YaneuraOu
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          path: YaneuraOu

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Build with Official Makefile (WASM / SFNN)
        working-directory: YaneuraOu/source
        run: |
          make clean
          make wasm \
            EVAL_TYPE=NNUE_SFNN \
            TARGET_CPU=WASM_SIMD \
            YANEURAOU_EDITION=YANEURAOU_ENGINE_NNUE \
            THREADS=OFF

      - name: Check output files
        working-directory: YaneuraOu/source
        run: ls -la

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-wasm-files
          path: |
            YaneuraOu/source/*.js
            YaneuraOu/source/*.wasm
