name: Build YaneuraOu WASM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YaneuraOu
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          path: YaneuraOu

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Compile YaneuraOu to WebAssembly
        working-directory: YaneuraOu/source
        run: |
          # make clean で判明した正規のソースファイル群を収集
          SOURCES=$(find . -name "*.cpp" \
            ! -path "./test/*" \
            ! -path "./extra/*" \
            ! -path "./engine/dlshogi-engine/*" \
            ! -path "./engine/help-mate-engine/*" \
            ! -path "./engine/mate-engine/*" \
            ! -path "./engine/tanuki-mate-engine/*" \
            ! -path "./engine/yaneuraou-mate-engine/*" \
            ! -path "./engine/user-engine/*" \
            ! -path "./eval/deep/*" \
            ! -path "./eval/material/*" \
            ! -path "./eval/kppt/*" \
            ! -path "./eval/kpp_kkpt/*")

          em++ -O3 -std=c++17 \
            -I. \
            -DNDEBUG -DIS_64BIT \
            -msimd128 -DUSE_WASM_SIMD \
            -DYANEURAOU_ENGINE_NNUE \
            -DEVAL_NNUE -DEVAL_NNUE_SFNN \
            -DNO_THREAD -DUSE_MAKEFILE \
            -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="YaneuraOu" \
            -s FORCE_FILESYSTEM=1 \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","FS"]' \
            -o yaneuraou.js \
            $SOURCES

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-wasm-files
          path: |
            YaneuraOu/source/yaneuraou.js
            YaneuraOu/source/yaneuraou.wasm
