name: Build YaneuraOu WASM

on:
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout YaneuraOu
        uses: actions/checkout@v4
        with:
          repository: yaneurao/YaneuraOu
          path: YaneuraOu

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Compile to WebAssembly (Single Thread / SFNN)
        working-directory: YaneuraOu/source
        run: |
          em++ -O3 -std=c++17 \
            -DNDEBUG -DIS_64BIT -DUSE_SSE2 -msimd128 \
            -DEVAL_NNUE -DEVAL_NNUE_SFNN \
            -DNO_THREAD \
            -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="YaneuraOu" \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap","addMessageListener","postMessage"]' \
            -o yaneuraou.js \
            main.cpp types.cpp bitboard.cpp misc.cpp movegen.cpp position.cpp \
            movepick.cpp search.cpp thread.cpp tt.cpp uci.cpp ucioption.cpp \
            eval/*.cpp eval/nnue/*.cpp eval/nnue/features/*.cpp eval/nnue/architectures/*.cpp

      - name: Upload WASM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaneuraou-wasm-files
          path: |
            YaneuraOu/source/yaneuraou.js
            YaneuraOu/source/yaneuraou.wasm
